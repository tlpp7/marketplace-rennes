name: Quality Gates P0 P1 P2
on:
  push:
  pull_request:
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: node --test scripts/test-unit.mjs
      - run: npm run test:config
  browser-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rennfripes_test
          POSTGRES_USER: rennfripes
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rennfripes -d rennfripes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rennfripes:ci-only-password@127.0.0.1:5432/rennfripes_test
      SESSION_SECRET: ci-secret-for-browser-tests-not-production
      ACCOUNTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Apply database schema
        run: |
          for f in infra/sql/0*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
